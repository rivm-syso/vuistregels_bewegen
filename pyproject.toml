[project]
name = "vuistregels"
version = "0.1.0"
description = "Vuistregels voor beweegvriendelijke buitenruimte per gemeente/buurt."
requires-python = ">=3.10"
dependencies = [
    "geopandas==1.1.1",
    "shapely>=2.0",
    "pandas>=2.0",
    "pyarrow",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
vuistregels = "cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "instellingen"]
packages = ["adapters", "usecases"]
